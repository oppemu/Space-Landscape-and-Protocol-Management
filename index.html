<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบขอใช้สถานที่และบริการ - กองกายภาพและสิ่งแวดล้อม</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f0f3f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .portal-card {
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 43, 102, 0.08);
      max-width: 900px;
      width: 100%;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .main-header-box {
      background: #1e1e50;
      color: white;
      border-radius: 16px;
      padding: 25px 20px;
      margin-bottom: 35px;
      box-shadow: 0 8px 20px rgba(30, 30, 80, 0.2);
    }
    .logo-img { max-width: 120px; height: auto; margin-bottom: 12px; }
    
    .service-btn-card {
      background: #0891b2;
      color: white;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(8, 145, 178, 0.2);
      height: 100%;
      border: none;
    }
    .service-btn-card:hover {
      background: #0e7490;
      color: white;
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(8, 145, 178, 0.35);
    }
    .service-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      display: block;
    }
    .service-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .service-desc {
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 300;
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center">
  <div class="portal-card text-center">
    
    <!-- Header Banner -->
    <div class="main-header-box">
      <img src="LOGO.png" alt="Logo" class="logo-img" onerror="this.src='LOGO.jpg'">
      <h3 class="fw-bold mb-1">ระบบขอใช้สถานที่และบริการ</h3>
      <p class="mb-0 opacity-75 fs-6">กองกายภาพและสิ่งแวดล้อม สำนักงานอธิการบดี มหาวิทยาลัยมหิดล</p>
    </div>

    <!-- Main Choice Cards (อ้างอิงตามผังของคุณ) -->
    <div class="row g-4 justify-content-center px-md-3">
      
      <!-- ตัวเลือกที่ 1: ขอใช้พื้นที่ส่วนกลาง -->
      <div class="col-md-6">
        <a href="menu-common.html" class="service-btn-card">
          <i class="bi bi-tree-fill service-icon"></i>
          <div class="service-title">ขอใช้พื้นที่ส่วนกลาง</div>
          <div class="service-desc">ลานกิจกรรม ถนนคนเดิน ทางเดิน และสนามหญ้า</div>
        </a>
      </div>

      <!-- ตัวเลือกที่ 2: ขอใช้พื้นที่อาคารและห้องประชุม -->
      <div class="col-md-6">
        <a href="menu-room.html" class="service-btn-card" style="background: #0284c7;">
          <i class="bi bi-building-fill-check service-icon"></i>
          <div class="service-title">ขอใช้พื้นที่อาคารและห้องประชุม</div>
          <div class="service-desc">อาคารสิริวิทยา, MLC และมหิดลสิทธาคาร (Booking Room)</div>
        </a>
      </div>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
