<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบขอใช้สถานที่และบริการ - เมนูหลัก</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 43, 102, 0.08);
      max-width: 800px;
      width: 100%;
    }
    .header-box {
      background-color: #002b66;
      color: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .logo-img {
      max-width: 100px;
      height: auto;
      margin-bottom: 10px;
    }
    .btn-menu {
      height: 120px;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease-in-out;
      border: 2px solid transparent;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-menu:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }
    .btn-menu i {
      font-size: 2rem;
    }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="menu-card mx-auto">
    <div class="header-box text-center">
      <img src="LOGO.png" alt="Logo" class="logo-img" onerror="this.src='LOGO.jpg'">
      <h4 class="mb-1">ระบบขอใช้สถานที่และบริการ</h4>
      <h6 class="mb-0 fw-light">กองกายภาพและสิ่งแวดล้อม สำนักงานอธิการบดี มหาวิทยาลัยมหิดล</h6>
    </div>

    <div class="row g-4">
      <!-- 1. ขอใช้สถานที่ -->
      <div class="col-md-6">
        <a href="./form.html" class="btn btn-primary btn-menu w-100 shadow-sm">
          <i class="bi bi-file-earmark-plus-fill"></i>
          <span>ขอใช้สถานที่</span>
        </a>
      </div>

      <!-- 2. ดูประวัติ (เชื่อมต่อไปยัง history.html เรียบร้อยแล้ว) -->
      <div class="col-md-6">
        <a href="./history.html" class="btn btn-info text-white btn-menu w-100 shadow-sm">
          <i class="bi bi-clock-history"></i>
          <span>ดูประวัติ</span>
        </a>
      </div>

      <!-- 3. พิมพ์เอกสาร -->
      <div class="col-md-6">
        <button type="button" class="btn btn-success btn-menu w-100 shadow-sm" onclick="alert('สามารถดูและพิมพ์เอกสารยื่นเรื่องได้ที่เมนู ดูประวัติ')">
          <i class="bi bi-printer-fill"></i>
          <span>พิมพ์เอกสาร</span>
        </button>
      </div>

      <!-- 4. ปิด -->
      <div class="col-md-6">
        <button type="button" class="btn btn-danger btn-menu w-100 shadow-sm" onclick="closeWindow()">
          <i class="bi bi-x-circle-fill"></i>
          <span>ปิด</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  function closeWindow() {
    if (confirm('คุณต้องการออกจากหน้าเว็บใช่หรือไม่?')) {
      window.close();
      setTimeout(function() {
        alert('กรุณาปิดหน้าต่างเบราว์เซอร์นี้ด้วยตนเอง');
      }, 300);
    }
  }
</script>
</body>
</html>
