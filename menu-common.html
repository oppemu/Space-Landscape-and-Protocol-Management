<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอใช้พื้นที่ส่วนกลาง - กองกายภาพและสิ่งแวดล้อม</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 10px; }
    .menu-card { background: #ffffff; border-radius: 28px; padding: 35px 30px; max-width: 680px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.06); }
    .btn-back-main { border: 1px solid #cbd5e1; color: #64748b; background: white; border-radius: 50px; padding: 6px 18px; font-size: 0.88rem; text-decoration: none; transition: all 0.2s; }
    .btn-back-main:hover { background: #f8fafc; color: #334155; }
    .btn-admin { background-color: #1e1e4b; color: #ffffff; border-radius: 50px; padding: 7px 20px; font-size: 0.88rem; font-weight: 600; text-decoration: none; box-shadow: 0 4px 10px rgba(30, 30, 75, 0.15); transition: all 0.2s; }
    .btn-admin:hover { background-color: #111133; color: #ffffff; transform: translateY(-1px); }
    .header-banner { background-color: #1e1e4b; color: white; border-radius: 18px; padding: 22px 15px; margin-top: 15px; margin-bottom: 25px; }
    .grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .btn-grid { border: none; border-radius: 18px; padding: 25px 15px; color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 1.05rem; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 6px 15px rgba(0,0,0,0.05); text-align: center; }
    .btn-grid:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); color: white; }
    .btn-request { background-color: #1e1e4b; }
    .btn-history { background-color: #0ea5e9; }
    .btn-edit { background-color: #eab308; }
    .btn-close-app { background-color: #ef4444; }
    @media (max-width: 576px) { .grid-menu { grid-template-columns: 1fr; } .menu-card { padding: 25px 20px; } }
  </style>
</head>
<body>

<div class="menu-card">
  <!-- แถวบน: ปุ่มย้อนกลับ & ปุ่ม Admin -->
  <div class="d-flex justify-content-between align-items-center">
    <a href="index.html" class="btn-back-main">
      <i class="bi bi-arrow-left me-1"></i> กลับหน้าเลือกบริการหลัก
    </a>
    <!-- ลิงก์ไปหน้า Admin ใหม่ -->
    <a href="common-admin.html" class="btn-admin">
      <i class="bi bi-shield-lock-fill text-warning me-1"></i> สำหรับเจ้าหน้าที่ (Admin)
    </a>
  </div>

  <!-- แบนเนอร์ชื่อระบบ -->
  <div class="header-banner text-center">
    <h4 class="fw-bold mb-1"><i class="bi bi-tree-fill me-2"></i>ขอใช้พื้นที่ส่วนกลาง</h4>
    <div class="small opacity-75">กองกายภาพและสิ่งแวดล้อม สำนักงานอธิการบดี มหาวิทยาลัยมหิดล</div>
  </div>

  <!-- เมนู 4 ปุ่มกด (อัปเดต href ชื่อไฟล์ใหม่) -->
  <div class="grid-menu">
    <a href="common-form.html" class="btn-grid btn-request">
      <i class="bi bi-file-earmark-plus fs-2"></i>
      <span>ขอใช้สถานที่</span>
    </a>

    <a href="common-history.html" class="btn-grid btn-history">
      <i class="bi bi-clock-history fs-2"></i>
      <span>ดูประวัติและสร้างเอกสาร</span>
    </a>

    <a href="common-edit.html" class="btn-grid btn-edit">
      <i class="bi bi-pencil-square fs-2"></i>
      <span>เปลี่ยนแปลงแก้ไขข้อมูล</span>
    </a>

    <a href="index.html" class="btn-grid btn-close-app">
      <i class="bi bi-x-circle fs-2"></i>
      <span>ปิด / ย้อนกลับ</span>
    </a>
  </div>
</div>

</body>
</html>
