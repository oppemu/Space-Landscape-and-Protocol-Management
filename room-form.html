<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบฟอร์มขอใช้พื้นที่อาคารและห้องประชุม</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f0f3f8; min-height: 100vh; color: #334155; }
    .form-card { background: white; border-radius: 20px; padding: 35px 30px; box-shadow: 0 10px 30px rgba(0, 43, 102, 0.06); max-width: 850px; margin: 30px auto; border: 1px solid rgba(226, 232, 240, 0.8); }
    .header-box { background: #0284c7; color: white; border-radius: 16px; padding: 20px; margin-bottom: 30px; }
    .section-header { color: #0284c7; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 20px; font-weight: 700; }
    .btn-submit { background-color: #0284c7; color: white; border-radius: 30px; padding: 12px 35px; font-weight: 600; border: none; transition: all 0.2s; }
    .btn-submit:hover { background-color: #0369a1; color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .room-item-row { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="mb-3" style="max-width: 850px; margin: 0 auto;">
    <a href="./menu-room.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i> ย้อนกลับหน้าเมนูห้องประชุม</a>
  </div>

  <div class="form-card">
    <div class="header-box text-center">
      <img src="LOGO.png" alt="Logo" style="max-width: 110px;" class="mb-2" onerror="this.src='LOGO.jpg'">
      <h4 class="fw-bold mb-1">แบบฟอร์มการขอใช้พื้นที่อาคารและห้องประชุม</h4>
      <p class="mb-0 small opacity-90">กองกายภาพและสิ่งแวดล้อม สำนักงานอธิการบดี มหาวิทยาลัยมหิดล</p>
    </div>

    <form id="roomBookingForm" onsubmit="handleBookingSubmit(event)">
      
      <!-- ส่วนที่ 1 -->
      <h5 class="section-header"><i class="bi bi-person-badge me-2"></i>1. ข้อมูลทั่วไปและผู้ขอใช้บริการ</h5>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">ชื่อ - สกุล ผู้ขอใช้บริการ <span class="text-danger">*</span></label>
          <input type="text" id="applicantName" class="form-control" placeholder="เช่น นายธิระพงศ์ เหมทานนท์" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">สถานะผู้ขอใช้บริการ <span class="text-danger">*</span></label>
          <select id="applicantStatus" class="form-select" required>
            <option value="">-- เลือกสถานะ --</option>
            <option value="บุคลากร/ส่วนงานภายใน">บุคลากร / ส่วนงานภายในมหาวิทยาลัย</option>
            <option value="นักศึกษา">นักศึกษา</option>
            <option value="บุคคล/หน่วยงานภายนอก">บุคคล / หน่วยงานภายนอก</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">หมายเลขโทรศัพท์ <span class="text-danger">*</span></label>
          <input type="tel" id="phone" class="form-control" placeholder="เช่น 0999999999" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">อีเมล <span class="text-danger">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="เช่น example@mahidol.ac.th" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">รหัสลับ 4 หลัก<span class="text-danger">*</span></label>
          <input type="password" id="pinCode" class="form-control text-center fw-bold" maxlength="4" placeholder="••••" required autocomplete="off">
        <div class="form-text text-muted small">(สำหรับแก้ไขและสร้างเอกสาร)</div>
        </div>
      </div>

      <!-- ส่วนที่ 2 -->
      <h5 class="section-header"><i class="bi bi-building-gear me-2"></i>2. รายละเอียดสถานที่และกิจกรรม</h5>
      <div class="row g-3 mb-4">
        <div class="col-12">
          <label class="form-label fw-semibold">ชื่อกิจกรรม / เรื่องที่ดำเนินการ <span class="text-danger">*</span></label>
          <input type="text" id="eventTitle" class="form-control" placeholder="เช่น ประชุมสภาอาจารย์มหาวิทยาลัยมหิดล" required>
        </div>

        <!-- กำหนดช่วงวันและเวลาก่อน -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">ตั้งแต่วันที่ <span class="text-danger">*</span></label>
          <input type="date" id="startDate" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">เวลาเริ่ม <span class="text-danger">*</span></label>
          <input type="time" id="startTime" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">ถึงวันที่ <span class="text-danger">*</span></label>
          <input type="date" id="endDate" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">เวลาสิ้นสุด <span class="text-danger">*</span></label>
          <input type="time" id="endTime" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">อาคาร / สถานที่ <span class="text-danger">*</span></label>
          <select id="building" class="form-select" onchange="checkAndFetchAvailableRooms()" required>
            <option value="">-- เลือกอาคาร --</option>
            <option value="อาคารสิริวิทยา">อาคารสิริวิทยา</option>
            <option value="อาคารศูนย์การเรียนรู้มหิดล (MLC)">อาคารศูนย์การเรียนรู้มหิดล (MLC)</option>
            <option value="อาคารมหิดลสิทธาคาร">อาคารมหิดลสิทธาคาร</option>
          </select>
        </div>

        <!-- รายการห้องประชุม -->
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label fw-semibold mb-0">ห้อง / พื้นที่จอง <span class="text-danger">*</span></label>
            <span id="roomCheckStatus" class="small text-muted"></span>
          </div>
          <div id="roomListContainer">
            <div class="room-item-row d-flex align-items-center gap-2">
              <select class="form-select room-select" required disabled>
                <option value="">-- กรุณาเลือกวัน เวลา และอาคารก่อน --</option>
              </select>
              <button type="button" class="btn btn-outline-danger btn-sm rounded-circle p-2 remove-btn" onclick="removeRoomRow(this)" style="display:none;" title="ลบห้องนี้">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
          <button type="button" id="addRoomBtn" class="btn btn-outline-primary btn-sm mt-1 rounded-pill" onclick="addRoomRow()" disabled>
            <i class="bi bi-plus-circle me-1"></i> เพิ่มห้องประชุมอีกห้อง
          </button>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">จำนวนผู้เข้าร่วม (คน) <span class="text-danger">*</span></label>
          <input type="number" id="attendeeCount" class="form-control" min="1" placeholder="เช่น 50" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">หมายเหตุ / ความต้องการเพิ่มเติม</label>
          <input type="text" id="remarks" class="form-control" placeholder="ระบุเพิ่มเติม (ถ้ามี)">
        </div>
      </div>

      <div class="text-center pt-3">
        <button type="submit" id="submitBtn" class="btn btn-submit shadow"><i class="bi bi-send-check me-2"></i>ยื่นคำขอจองห้องประชุม</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>
  const ROOM_MAPPING = {
    "อาคารสิริวิทยา": [
      "ห้อง 101 (ห้องประชุมย่อย)",
      "ห้อง 201 (ห้องบรรยายใหญ่)",
      "ห้อง 301 (ห้องประชุมสัมมนา)",
      "พื้นที่อเนกประสงค์ ชั้น 1"
    ],
    "อาคารศูนย์การเรียนรู้มหิดล (MLC)": [
      "MLC Hall 1",
      "MLC Hall 2",
      "ห้องประชุม 217",
      "ห้องประชุม 322",
      "ลานกิจกรรม Co-Working Space"
    ],
    "อาคารมหิดลสิทธาคาร": [
      "หอประชุมใหญ่ (Auditorium)",
      "ห้องรับรอง VIP",
      "โถงนิทรรศการ (Foyer ชั้น 1)",
      "ห้องซ้อมแสดง A"
    ]
  };

  let currentlyBookedRooms = [];

  function checkAndFetchAvailableRooms() {
    const startDate = document.getElementById('startDate').value;
    const startTime = document.getElementById('startTime').value;
    const endDate = document.getElementById('endDate').value;
    const endTime = document.getElementById('endTime').value;
    const building = document.getElementById('building').value;
    const statusSpan = document.getElementById('roomCheckStatus');

    if (!startDate || !startTime || !endDate || !endTime || !building) {
      statusSpan.innerHTML = '<span class="text-muted">กรุณากรอกวัน เวลา และเลือกอาคารให้ครบถ้วน</span>';
      disableAllRoomSelects();
      return;
    }

    statusSpan.innerHTML = '<span class="text-primary"><span class="spinner-border spinner-border-sm me-1"></span>กำลังเช็คสถานะห้องว่าง...</span>';

    const oldScript = document.getElementById('chkRoomScript');
    if (oldScript) oldScript.remove();

    window.onBookedRoomsReceived = function(data) {
      if (data && data.success) {
        currentlyBookedRooms = data.bookedRooms || [];
        statusSpan.innerHTML = currentlyBookedRooms.length > 0 
          ? `<span class="text-danger"><i class="bi bi-exclamation-circle me-1"></i>มี ${currentlyBookedRooms.length} ห้องติดจองในช่วงเวลานี้</span>`
          : '<span class="text-success"><i class="bi bi-check-circle me-1"></i>ทุกห้องพร้อมใช้งาน</span>';
      } else {
        currentlyBookedRooms = [];
        statusSpan.innerHTML = '';
      }
      refreshAllRoomDropdowns(building);
    };

    const script = document.createElement('script');
    script.id = 'chkRoomScript';
    // แก้ชื่อ action=checkRoomAvailability ให้ตรงกับใน Code.gs
    script.src = `${CONFIG.WEB_APP_URL}?action=checkRoomAvailability&building=${encodeURIComponent(building)}&startDate=${encodeURIComponent(startDate)}&startTime=${encodeURIComponent(startTime)}&endDate=${encodeURIComponent(endDate)}&endTime=${encodeURIComponent(endTime)}&callback=onBookedRoomsReceived`;
    document.body.appendChild(script);
  }

  function disableAllRoomSelects() {
    const selects = document.querySelectorAll('.room-select');
    selects.forEach(s => {
      s.disabled = true;
      s.innerHTML = '<option value="">-- กรุณาเลือกวัน เวลา และอาคารก่อน --</option>';
    });
    document.getElementById('addRoomBtn').disabled = true;
  }

  function refreshAllRoomDropdowns(building) {
    const selects = document.querySelectorAll('.room-select');
    selects.forEach(s => {
      const currentVal = s.value;
      populateOptions(s, building);
      if (currentVal && !currentlyBookedRooms.includes(currentVal)) {
        s.value = currentVal;
      }
    });
    document.getElementById('addRoomBtn').disabled = !building;
  }

  function populateOptions(selectElem, building) {
    selectElem.innerHTML = '<option value="">-- เลือกห้อง / พื้นที่ --</option>';
    if (building && ROOM_MAPPING[building]) {
      selectElem.disabled = false;
      ROOM_MAPPING[building].forEach(room => {
        const isBooked = currentlyBookedRooms.includes(room);
        const opt = document.createElement('option');
        opt.value = room;
        opt.textContent = isBooked ? `${room} [ติดจองแล้ว]` : room;
        if (isBooked) {
          opt.disabled = true;
          opt.style.color = '#dc2626';
        }
        selectElem.appendChild(opt);
      });
    } else {
      selectElem.disabled = true;
      selectElem.innerHTML = '<option value="">-- กรุณาเลือกอาคารก่อน --</option>';
    }
  }

  function addRoomRow() {
    const building = document.getElementById('building').value;
    if (!building) return;

    const container = document.getElementById('roomListContainer');
    const newRow = document.createElement('div');
    newRow.className = 'room-item-row d-flex align-items-center gap-2 mt-2';
    
    const select = document.createElement('select');
    select.className = 'form-select room-select';
    select.required = true;
    populateOptions(select, building);

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'btn btn-outline-danger btn-sm rounded-circle p-2 remove-btn';
    deleteBtn.title = 'ลบห้องนี้';
    deleteBtn.innerHTML = '<i class="bi bi-trash"></i>';
    deleteBtn.onclick = function() { removeRoomRow(this); };

    newRow.appendChild(select);
    newRow.appendChild(deleteBtn);
    container.appendChild(newRow);

    updateRemoveButtons();
  }

  function removeRoomRow(btn) {
    const row = btn.closest('.room-item-row');
    row.remove();
    updateRemoveButtons();
  }

  function updateRemoveButtons() {
    const rows = document.querySelectorAll('.room-item-row');
    rows.forEach(row => {
      const btn = row.querySelector('.remove-btn');
      if (btn) btn.style.display = rows.length > 1 ? 'inline-block' : 'none';
    });
  }

  function handleBookingSubmit(e) {
    e.preventDefault();

    const selects = document.querySelectorAll('.room-select');
    const selectedRooms = [];
    selects.forEach(s => {
      if (s.value && !selectedRooms.includes(s.value)) {
        selectedRooms.push(s.value);
      }
    });

    if (selectedRooms.length === 0) {
      alert("กรุณาเลือกห้องประชุมอย่างน้อย 1 ห้อง");
      return;
    }

    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    if (new Date(endDate) < new Date(startDate)) {
      alert("วันสิ้นสุดต้องไม่อยู่ก่อนวันเริ่มต้นกิจกรรม");
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังส่งข้อมูล...';

    // ปรับการส่งเป็น URLSearchParams เพื่อรองรับ Google Apps Script
    const payload = new URLSearchParams();
    payload.append('action', 'createRoomBooking');
    payload.append('startDate', startDate);
    payload.append('endDate', endDate);
    payload.append('startTime', document.getElementById('startTime').value);
    payload.append('endTime', document.getElementById('endTime').value);
    payload.append('building', document.getElementById('building').value);
    payload.append('room', selectedRooms.join(', '));
    payload.append('activityName', document.getElementById('eventTitle').value);
    payload.append('requesterName', document.getElementById('applicantName').value);
    payload.append('userStatus', document.getElementById('applicantStatus').value);
    payload.append('participantCount', document.getElementById('attendeeCount').value);
    payload.append('pinCode', document.getElementById('pinCode').value);
    payload.append('phone', document.getElementById('phone').value);
    payload.append('email', document.getElementById('email').value);
    payload.append('remarks', document.getElementById('remarks').value);

    fetch(CONFIG.WEB_APP_URL, {
      method: 'POST',
      body: payload
    })
    .then(() => {
      alert("บันทึกคำขอจองห้องประชุมเรียบร้อยแล้ว!");
      window.location.href = "menu-room.html";
    })
    .catch(err => {
      alert("บันทึกคำขอจองห้องประชุมเรียบร้อยแล้ว!");
      window.location.href = "menu-room.html";
    });
  }
</script>
</body>
</html>
