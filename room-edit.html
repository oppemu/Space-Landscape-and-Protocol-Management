<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แก้ไขข้อมูลการจองห้องประชุม</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f0f3f8; min-height: 100vh; color: #334155; }
    .form-card { background: white; border-radius: 20px; padding: 35px 30px; box-shadow: 0 10px 30px rgba(0, 43, 102, 0.06); max-width: 850px; margin: 30px auto; border: 1px solid rgba(226, 232, 240, 0.8); }
    .auth-card { background: white; border-radius: 20px; padding: 30px; max-width: 450px; margin: 50px auto; box-shadow: 0 10px 30px rgba(0, 43, 102, 0.08); }
    .header-box { background: #1e1b4b; color: white; border-radius: 16px; padding: 20px; margin-bottom: 30px; }
    .section-header { color: #1e1b4b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 20px; font-weight: 700; }
    .btn-submit { background-color: #1e1b4b; color: white; border-radius: 30px; padding: 12px 35px; font-weight: 600; border: none; transition: all 0.2s; }
    .btn-submit:hover { background-color: #312e81; color: white; }
    .room-item-row { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="mb-3" style="max-width: 850px; margin: 0 auto;">
    <a href="./menu-room.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i> ย้อนกลับหน้าเมนูห้องประชุม</a>
  </div>

  <!-- ส่วนที่ 1: หน้าฟอร์มกรอก PIN ก่อนเข้าแก้ไข -->
  <div id="authSection" class="auth-card text-center">
    <img src="LOGO.png" alt="Logo" style="max-width: 90px;" class="mb-2" onerror="this.src='LOGO.jpg'">
    <h5 class="fw-bold mb-1">🔑 ยืนยันรหัสผ่านเพื่อแก้ไขข้อมูล</h5>
    <p class="text-muted small mb-4">กรุณากรอกรหัสคำขอ และรหัสลับ 4 หลักที่ท่านตั้งไว้ขณะยื่นแบบฟอร์ม</p>

    <form onsubmit="handleVerifyAuth(event)">
      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">รหัสคำขอ (Request ID) <span class="text-danger">*</span></label>
        <input type="text" id="authRequestId" class="form-control text-uppercase" placeholder="เช่น BR0001" required>
      </div>
      <div class="mb-4 text-start">
        <label class="form-label fw-semibold">รหัสลับ 4 หลัก (PIN) <span class="text-danger">*</span></label>
        <input type="password" id="authPin" class="form-control text-center fw-bold" maxlength="4" placeholder="••••" required autocomplete="off">
      </div>
      <button type="submit" id="authBtn" class="btn btn-submit w-100"><i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่หน้าแก้ไขข้อมูล</button>
    </form>
  </div>

  <!-- ส่วนที่ 2: หน้าฟอร์มแก้ไขข้อมูล -->
  <div id="editSection" class="form-card" style="display: none;">
    <div class="header-box text-center">
      <h4 class="fw-bold mb-1">แก้ไขข้อมูลการจองห้องประชุม</h4>
      <p class="mb-0 small opacity-90">รหัสคำขอ: <span id="displayRequestId" class="fw-bold text-warning"></span></p>
    </div>

    <form id="editBookingForm" onsubmit="handleEditSubmit(event)">
      <h5 class="section-header"><i class="bi bi-person-badge me-2"></i>1. ข้อมูลทั่วไปและผู้ขอใช้บริการ</h5>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">ชื่อ - สกุล ผู้ขอใช้บริการ <span class="text-danger">*</span></label>
          <input type="text" id="applicantName" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">สถานะผู้ขอใช้บริการ <span class="text-danger">*</span></label>
          <select id="applicantStatus" class="form-select" required>
            <option value="บุคลากร/ส่วนงานภายใน">บุคลากร / ส่วนงานภายในมหาวิทยาลัย</option>
            <option value="นักศึกษา">นักศึกษา</option>
            <option value="บุคคล/หน่วยงานภายนอก">บุคคล / หน่วยงานภายนอก</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">หมายเลขโทรศัพท์ <span class="text-danger">*</span></label>
          <input type="tel" id="phone" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">อีเมล <span class="text-danger">*</span></label>
          <input type="email" id="email" class="form-control" required>
        </div>
      </div>

      <h5 class="section-header"><i class="bi bi-building-gear me-2"></i>2. รายละเอียดสถานที่และกิจกรรม</h5>
      <div class="row g-3 mb-4">
        <div class="col-12">
          <label class="form-label fw-semibold">ชื่อกิจกรรม / เรื่องที่ดำเนินการ <span class="text-danger">*</span></label>
          <input type="text" id="eventTitle" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold">ตั้งแต่วันที่ <span class="text-danger">*</span></label>
          <input type="date" id="startDate" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">เวลาเริ่ม <span class="text-danger">*</span></label>
          <input type="time" id="startTime" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">ถึงวันที่ <span class="text-danger">*</span></label>
          <input type="date" id="endDate" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">เวลาสิ้นสุด <span class="text-danger">*</span></label>
          <input type="time" id="endTime" class="form-control" onchange="checkAndFetchAvailableRooms()" required>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">อาคาร / สถานที่ <span class="text-danger">*</span></label>
          <select id="building" class="form-select" onchange="checkAndFetchAvailableRooms()" required>
            <option value="อาคารสิริวิทยา">อาคารสิริวิทยา</option>
            <option value="อาคารศูนย์การเรียนรู้มหิดล (MLC)">อาคารศูนย์การเรียนรู้มหิดล (MLC)</option>
            <option value="อาคารมหิดลสิทธาคาร">อาคารมหิดลสิทธาคาร</option>
          </select>
        </div>

        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label fw-semibold mb-0">ห้อง / พื้นที่จอง <span class="text-danger">*</span></label>
            <span id="roomCheckStatus" class="small text-muted"></span>
          </div>
          <div id="roomListContainer"></div>
          <button type="button" id="addRoomBtn" class="btn btn-outline-primary btn-sm mt-1 rounded-pill" onclick="addRoomRow()">
            <i class="bi bi-plus-circle me-1"></i> เพิ่มห้องประชุมอีกห้อง
          </button>
        </div>

        <div class="col-md-12">
          <label class="form-label fw-semibold">จำนวนผู้เข้าร่วม (คน) <span class="text-danger">*</span></label>
          <input type="number" id="attendeeCount" class="form-control" min="1" required>
        </div>
      </div>

      <div class="text-center pt-3">
        <button type="submit" id="submitBtn" class="btn btn-submit shadow"><i class="bi bi-save me-2"></i>บันทึกการแก้ไขข้อมูล</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>
  const ROOM_MAPPING = {
    "อาคารสิริวิทยา": [
      "ห้อง 101 (ห้องประชุมย่อย)",
      "ห้อง 201 (ห้องบรรยายใหญ่)",
      "ห้อง 301 (ห้องประชุมสัมมนา)",
      "พื้นที่อเนกประสงค์ ชั้น 1"
    ],
    "อาคารศูนย์การเรียนรู้มหิดล (MLC)": [
      "MLC Hall 1",
      "MLC Hall 2",
      "ห้องประชุม 217",
      "ห้องประชุม 322",
      "ลานกิจกรรม Co-Working Space"
    ],
    "อาคารมหิดลสิทธาคาร": [
      "หอประชุมใหญ่ (Auditorium)",
      "ห้องรับรอง VIP",
      "โถงนิทรรศการ (Foyer ชั้น 1)",
      "ห้องซ้อมแสดง A"
    ]
  };

  let currentlyBookedRooms = [];
  let currentRequestId = "";
  let loadedRooms = [];

  function handleVerifyAuth(e) {
    e.preventDefault();
    const reqId = document.getElementById('authRequestId').value.trim().toUpperCase();
    const pin = document.getElementById('authPin').value.trim();
    const btn = document.getElementById('authBtn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังตรวจสอบ...';

    const oldScript = document.getElementById('vScript');
    if (oldScript) oldScript.remove();

    window.onAuthVerified = function(res) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่หน้าแก้ไขข้อมูล';

      if (res && res.success) {
        currentRequestId = reqId;
        loadBookingData(reqId);
      } else {
        alert("รหัสคำขอ หรือ รหัส PIN ไม่ถูกต้อง!");
      }
    };

    const script = document.createElement('script');
    script.id = 'vScript';
    script.src = `${CONFIG.WEB_APP_URL}?action=verifyPin&requestId=${encodeURIComponent(reqId)}&pin=${encodeURIComponent(pin)}&callback=onAuthVerified`;
    document.body.appendChild(script);
  }

  function loadBookingData(reqId) {
    const oldScript = document.getElementById('gScript');
    if (oldScript) oldScript.remove();

    window.onBookingLoaded = function(res) {
      if (res && res.success && res.data) {
        const d = res.data;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('editSection').style.display = 'block';
        document.getElementById('displayRequestId').innerText = reqId;

        document.getElementById('applicantName').value = d.applicantName || "";
        document.getElementById('applicantStatus').value = d.applicantStatus || "บุคลากร/ส่วนงานภายใน";
        document.getElementById('phone').value = d.phone || "";
        document.getElementById('email').value = d.email || "";
        document.getElementById('eventTitle').value = d.eventTitle || "";
        document.getElementById('startDate').value = d.startDate || "";
        document.getElementById('startTime').value = d.startTime || "";
        document.getElementById('endDate').value = d.endDate || "";
        document.getElementById('endTime').value = d.endTime || "";
        document.getElementById('building').value = d.building || "อาคารสิริวิทยา";
        document.getElementById('attendeeCount').value = d.attendeeCount || 1;

        loadedRooms = d.rooms && d.rooms.length > 0 ? d.rooms : [d.roomName];
        checkAndFetchAvailableRooms();
      } else {
        alert("ไม่พบข้อมูลการจอง");
      }
    };

    const script = document.createElement('script');
    script.id = 'gScript';
    script.src = `${CONFIG.WEB_APP_URL}?action=getBookingById&bookingId=${encodeURIComponent(reqId)}&callback=onBookingLoaded`;
    document.body.appendChild(script);
  }

  function checkAndFetchAvailableRooms() {
    const startDate = document.getElementById('startDate').value;
    const startTime = document.getElementById('startTime').value;
    const endDate = document.getElementById('endDate').value;
    const endTime = document.getElementById('endTime').value;
    const building = document.getElementById('building').value;
    const statusSpan = document.getElementById('roomCheckStatus');

    if (!startDate || !startTime || !endDate || !endTime || !building) return;

    statusSpan.innerHTML = '<span class="text-primary"><span class="spinner-border spinner-border-sm me-1"></span>กำลังเช็คสถานะห้อง...</span>';

    const oldScript = document.getElementById('chkRoomScript');
    if (oldScript) oldScript.remove();

    window.onBookedRoomsReceived = function(data) {
      if (data && data.success) {
        currentlyBookedRooms = data.bookedRooms || [];
        statusSpan.innerHTML = '<span class="text-success"><i class="bi bi-check-circle me-1"></i>เช็คสถานะห้องสำเร็จ</span>';
      } else {
        currentlyBookedRooms = [];
        statusSpan.innerHTML = '';
      }
      renderRoomRows(building);
    };

    const script = document.createElement('script');
    script.id = 'chkRoomScript';
    script.src = `${CONFIG.WEB_APP_URL}?action=checkRoomAvailability&building=${encodeURIComponent(building)}&startDate=${encodeURIComponent(startDate)}&startTime=${encodeURIComponent(startTime)}&endDate=${encodeURIComponent(endDate)}&endTime=${encodeURIComponent(endTime)}&callback=onBookedRoomsReceived`;
    document.body.appendChild(script);
  }

  function renderRoomRows(building) {
    const container = document.getElementById('roomListContainer');
    container.innerHTML = '';

    const targetList = loadedRooms.length > 0 ? loadedRooms : [""];
    targetList.forEach((rVal) => {
      addRoomRowWithValue(building, rVal);
    });
    loadedRooms = []; 
  }

  function addRoomRowWithValue(building, val) {
    const container = document.getElementById('roomListContainer');
    const newRow = document.createElement('div');
    newRow.className = 'room-item-row d-flex align-items-center gap-2 mt-2';
    
    const select = document.createElement('select');
    select.className = 'form-select room-select';
    select.required = true;
    populateOptions(select, building, val);

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'btn btn-outline-danger btn-sm rounded-circle p-2 remove-btn';
    deleteBtn.title = 'ลบห้องนี้';
    deleteBtn.innerHTML = '<i class="bi bi-trash"></i>';
    deleteBtn.onclick = function() { removeRoomRow(this); };

    newRow.appendChild(select);
    newRow.appendChild(deleteBtn);
    container.appendChild(newRow);

    updateRemoveButtons();
  }

  function addRoomRow() {
    const building = document.getElementById('building').value;
    if (!building) return;
    addRoomRowWithValue(building, "");
  }

  function populateOptions(selectElem, building, defaultVal) {
    selectElem.innerHTML = '<option value="">-- เลือกห้อง / พื้นที่ --</option>';
    if (building && ROOM_MAPPING[building]) {
      ROOM_MAPPING[building].forEach(room => {
        const isBooked = currentlyBookedRooms.some(bRoom => bRoom.trim().toLowerCase() === room.trim().toLowerCase());
        const isSelfSelected = defaultVal && defaultVal.trim().toLowerCase() === room.trim().toLowerCase();
        
        const opt = document.createElement('option');
        opt.value = room;
        
        if (isBooked && !isSelfSelected) {
          opt.textContent = `${room} ❌ (ติดจองแล้วในช่วงเวลานี้)`;
          opt.disabled = true;
          opt.style.color = '#dc2626';
          opt.style.backgroundColor = '#fee2e2';
        } else {
          opt.textContent = room;
        }

        if (isSelfSelected) opt.selected = true;
        selectElem.appendChild(opt);
      });
    }
  }

  function removeRoomRow(btn) {
    const row = btn.closest('.room-item-row');
    row.remove();
    updateRemoveButtons();
  }

  function updateRemoveButtons() {
    const rows = document.querySelectorAll('.room-item-row');
    rows.forEach(row => {
      const btn = row.querySelector('.remove-btn');
      if (btn) btn.style.display = rows.length > 1 ? 'inline-block' : 'none';
    });
  }

  function handleEditSubmit(e) {
    e.preventDefault();

    const selects = document.querySelectorAll('.room-select');
    const selectedRooms = [];
    selects.forEach(s => {
      if (s.value && !selectedRooms.includes(s.value)) {
        selectedRooms.push(s.value);
      }
    });

    if (selectedRooms.length === 0) {
      alert("กรุณาเลือกห้องประชุมอย่างน้อย 1 ห้อง");
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังบันทึกการแก้ไข...';

    const payload = new URLSearchParams();
    payload.append('action', 'updateRoomBooking');
    payload.append('bookingId', currentRequestId);
    payload.append('requestId', currentRequestId);
    payload.append('startDate', document.getElementById('startDate').value);
    payload.append('endDate', document.getElementById('endDate').value);
    payload.append('startTime', document.getElementById('startTime').value);
    payload.append('endTime', document.getElementById('endTime').value);
    payload.append('building', document.getElementById('building').value);
    payload.append('roomName', selectedRooms.join(', '));
    payload.append('room', selectedRooms.join(', '));
    payload.append('eventTitle', document.getElementById('eventTitle').value);
    payload.append('applicantName', document.getElementById('applicantName').value);
    payload.append('applicantStatus', document.getElementById('applicantStatus').value);
    payload.append('attendeeCount', document.getElementById('attendeeCount').value);
    payload.append('phone', document.getElementById('phone').value);
    payload.append('email', document.getElementById('email').value);

    fetch(CONFIG.WEB_APP_URL, {
      method: 'POST',
      body: payload
    })
    .then(res => res.json())
    .then(data => {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-save me-2"></i>บันทึกการแก้ไขข้อมูล';

      if (data && data.success) {
        alert("แก้ไขข้อมูลการจองเรียบร้อยแล้ว!");
        window.location.href = "menu-room.html";
      } else {
        alert("ไม่สามารถบันทึกการแก้ไขได้: " + (data.message || "ห้องติดจองช่วงเวลานี้อยู่แล้ว"));
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-save me-2"></i>บันทึกการแก้ไขข้อมูล';
      alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
      window.location.href = "menu-room.html";
    });
  }
</script>
</body>
</html>
