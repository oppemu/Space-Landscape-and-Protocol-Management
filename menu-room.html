<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอใช้พื้นที่อาคารและห้องประชุม - ระบบขอใช้สถานที่</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: #f0f3f8; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .menu-card { 
      background: white; 
      border-radius: 24px; 
      padding: 40px 30px; 
      box-shadow: 0 15px 35px rgba(0, 43, 102, 0.08); 
      max-width: 800px; 
      width: 100%; 
    }
    .header-box { 
      background: #0284c7; 
      color: white; 
      border-radius: 16px; 
      padding: 20px; 
      margin-bottom: 30px; 
    }
    .btn-sub { 
      border-radius: 16px; 
      padding: 25px 15px; 
      font-weight: 700; 
      text-decoration: none; 
      color: white; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      transition: all 0.2s; 
      min-height: 120px; 
    }
    .btn-sub:hover { 
      transform: translateY(-3px); 
      color: white; 
      opacity: 0.95; 
    }
    .btn-admin-link {
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 600;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      transition: all 0.2s;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .btn-admin-link:hover {
      background-color: #1e1b4b;
      color: white;
      border-color: #1e1b4b;
      box-shadow: 0 4px 12px rgba(30, 27, 75, 0.2);
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center my-4">
  <div class="menu-card text-center">
    
    <!-- แถบปุ่มย้อนกลับทางซ้าย และปุ่มสำหรับเจ้าหน้าที่ (Admin) ทางขวา -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> กลับหน้าเลือกบริการหลัก
      </a>
      <a href="room-admin.html" class="btn-admin">
  <i class="bi bi-shield-lock-fill text-warning me-1"></i> สำหรับเจ้าหน้าที่ (Admin)
</a>
    </div>

    <div class="header-box">
      <h4 class="fw-bold mb-1"><i class="bi bi-building-fill-check me-2"></i>ขอใช้พื้นที่อาคารและห้องประชุม</h4>
      <p class="mb-0 small opacity-75">Room & Building Reservation System (Booking Room)</p>
    </div>

    <!-- 4 ปุ่มย่อยตามผังเมนูหลัก -->
    <div class="row g-3">
      <div class="col-6">
        <a href="room-form.html" class="btn-sub" style="background-color: #1e1e50;">
          <i class="bi bi-door-open-fill fs-2 mb-2"></i>
          <span>จองห้องประชุม</span>
        </a>
      </div>
      <div class="col-6">
        <a href="room-history.html" class="btn-sub" style="background-color: #0ea5e9;">
          <i class="bi bi-clock-history fs-2 mb-2"></i>
          <span>ดูประวัติและสร้างเอกสาร</span>
        </a>
      </div>
      <div class="col-6">
        <a href="room-edit.html" class="btn-sub" style="background-color: #eab308; color: #1e293b;">
          <i class="bi bi-pencil-square fs-2 mb-2"></i>
          <span>เปลี่ยนแปลงแก้ไขข้อมูล</span>
        </a>
      </div>
      <div class="col-6">
        <a href="index.html" class="btn-sub" style="background-color: #ef4444;">
          <i class="bi bi-x-circle fs-2 mb-2"></i>
          <span>ปิด / ย้อนกลับ</span>
        </a>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
